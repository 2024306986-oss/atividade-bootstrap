<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossos Contatos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-primary text-white text-center py-4">
    <div class="container">
        <h1 class="fw-bold">Nossos Contatos</h1>
    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold mx-auto" href="#">Guia Automotivo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Início</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="contato.html">Contatos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="sobre.html">Sobre nós</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="container py-5">
    <div class="row g-4">
        <!-- IMAGEM -->
        <div class="col-md-6">
            <img src="../img/cofre.jpg" class="img-fluid rounded" alt="cofre do motor de um carro">
        </div>

        <!-- FORMULÁRIO -->
        <div class="col-md-6">
            <h2 class="text-center mb-4">Envie uma Mensagem</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Nome completo:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Seu nome completo aqui...">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Seu melhor email aqui...">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Mensagem:</label>
                    <textarea id="message" name="message" class="form-control" rows="4" placeholder="Sua mensagem aqui..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar</button>
            </form>
        </div>
    </div>
</section>

<section class="container py-5">
    <div class="row text-center">
        <!-- INFORMAÇÕES DE CONTATO -->
        <div class="col-md-6 mb-4">
            <h2>Contatos</h2>
            <p>autoguia@gmail.com</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
                    <img src="../img/facebook.png" alt="Facebook" width="30px">
                </a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
                    <img src="../img/instagram.png" alt="Instagram" width="30px">
                </a>
                <a href="https://wa.me/5551999999999" target="_blank" rel="noopener noreferrer">
                    <img src="../img/whatsapp.png" alt="WhatsApp" width="30px">
                </a>
            </div>
        </div>

        <!-- LOCALIZAÇÃO -->
        <div class="col-md-6">
            <h2>Onde estamos</h2>
            <p>Sertão, Rio Grande do Sul</p>
        </div>
    </div>
</section>

<div class="text-center py-4">
    <a href="index.html" class="btn btn-secondary">Voltar ⬅</a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
